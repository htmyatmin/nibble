<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#231a1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Nibble</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
/* VOICE: sweet, playful, tidy — a pocket food diary
   IDEA: a sticker-and-polaroid scrapbook calendar
   PICTURE: the month grid itself, every day a tiny meal photo
   COLOUR and TYPE: cream + strawberry rose, pastel meal chips; iOS rounded system font
   LAYOUT: one phone column; header, stats, calendar, today's plate, floating snap button */
:root{--fh:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;--fb:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color-scheme:light dark;--bg:light-dark(#fff6ee,#231a1e);--card:light-dark(#fff,#33252b);--ink:light-dark(#5b3a43,#fbe9ee);--soft:light-dark(#9b7880,#c9a9b2);--rose:#ef6d8a;--rose2:#ff9aa9;--pink:light-dark(#ffd6de,#6b3445);--peach:light-dark(#ffdcc7,#6a4033);--mint:light-dark(#d2f1e1,#2f5444);--butter:light-dark(#fff0b5,#5e5226);--lav:light-dark(#e5dfff,#433c69);--dot:light-dark(#ffd9e1,#3b2930);--cell:light-dark(#fff1f3,#3b2a31);--line:light-dark(#f6dde3,#4a3239);--shadow:light-dark(rgba(239,109,138,.16),rgba(0,0,0,.35))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,label,.day,.pola{-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
body{margin:0;color:var(--ink);font:16px/1.5 var(--fb);overflow-x:clip;background:radial-gradient(var(--dot) 1.7px,transparent 2px) 0 0/22px 22px,var(--bg);min-height:100vh}
h1,h2,h3,.f{font-family:var(--fh);margin:0;line-height:1.1}
button,input,textarea,label.btn{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(130px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{background:var(--card);border-radius:26px;box-shadow:0 8px 24px var(--shadow);padding:16px}
header{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
header .hi{color:var(--soft);font-weight:700;font-size:15px}
header h1{font-size:40px;font-weight:700;letter-spacing:-.5px}
header .date{color:var(--soft);font-size:14px}
.mascot{width:78px;height:78px;flex:none;transform:rotate(-8deg);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(-4deg) translateY(-5px)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{border-radius:20px;padding:10px 6px;text-align:center}
.stat b{display:block;font:700 24px var(--fh)}
.stat span{font-size:13px;font-weight:700;color:var(--soft)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{font-size:24px;text-align:center}
.cal-head small{display:block;text-align:center;color:var(--soft);font-weight:700;font-size:13px}
.round{width:44px;height:44px;border-radius:50%;background:var(--pink);display:grid;place-items:center;color:var(--rose);transition:transform .15s}
.round:active{transform:scale(.9)}.round[disabled]{opacity:.3}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk span{text-align:center;font:700 13px var(--fh);color:var(--rose);opacity:.75;padding-bottom:4px}
.day{position:relative;aspect-ratio:.8;border-radius:12px;background:var(--cell);overflow:hidden;display:grid;place-items:center;font:600 15px var(--fh);padding:0}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.day .n{position:relative}
.day.has .n{position:absolute;top:3px;left:3px;font-size:13px;color:#fff;background:rgba(0,0,0,.36);border-radius:99px;padding:0 5px}
.day .c{position:absolute;right:3px;bottom:3px;min-width:18px;height:18px;border-radius:9px;background:var(--rose);color:#fff;font-size:13px;line-height:15px;border:1.5px solid #fff}
.day.today{box-shadow:inset 0 0 0 2.5px var(--rose)}.day.today:not(.has){background:var(--pink)}
.day.future{opacity:.35;pointer-events:none}.day.blank{background:none}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title h2{font-size:22px}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 12px}
.strip>.pola{flex:none;width:140px;scroll-snap-align:start}
.pola{background:#fff;border-radius:10px;padding:8px 8px 6px;box-shadow:0 6px 16px rgba(91,58,67,.16);color:#5b3a43;text-align:center;transition:transform .15s;position:relative;display:block;width:100%}
.pola:active{transform:scale(.95)!important}
.pola .ph{aspect-ratio:1;border-radius:6px;overflow:hidden;background:#ffe9ee}
.pola img{width:100%;height:100%;object-fit:cover;display:block}
.pola .cap{font:600 14px var(--fh);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pola .sub{font-size:13px;color:#9b7880;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pola .heart{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--rose);display:grid;place-items:center}
.empty{text-align:center;padding:18px 8px;color:var(--soft);font-weight:700}
.empty svg{width:64px;height:64px;animation:bob 2.6s ease-in-out infinite}
.empty h3{color:var(--ink);font-size:18px;margin:6px 0 2px}
.snap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:16px 28px;border-radius:99px;background:linear-gradient(135deg,var(--rose2),var(--rose));color:#fff;font:700 18px var(--fh);box-shadow:0 10px 24px rgba(239,109,138,.45);border:3px solid rgba(255,255,255,.65);z-index:5;transition:transform .15s;white-space:nowrap}
.snap:active{transform:translateX(-50%) scale(.93)}
.note{font-size:13px;color:var(--soft);text-align:center;margin-top:14px;font-weight:700}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(60,30,40,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.3,1.15)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheet-top h2{font-size:22px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.big-choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:20px;background:var(--card);box-shadow:0 6px 18px var(--shadow);margin-bottom:12px;font:600 18px var(--fh);cursor:pointer}
.big-choice i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.lbl{font:600 15px var(--fh);color:var(--soft);margin:18px 2px 8px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.chip{border-radius:16px;padding:9px 2px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);text-align:center;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.chip em{display:block;font-style:normal;font-size:26px;line-height:1.2}
.chip span{font-size:13px;font-weight:800}
.chip[aria-pressed=true]{transform:scale(1.07);box-shadow:inset 0 0 0 1.5px rgba(91,58,67,.18);color:#5b3a43}
.field{width:100%;border:0;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);padding:13px 15px;font-size:16px;font-weight:700}
textarea.field{resize:vertical;min-height:84px}
.fav{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:14px;padding:13px 15px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800}
.fav .sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.fav .sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.6,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.fav[aria-pressed=true] .sw{background:var(--rose)}.fav[aria-pressed=true] .sw:after{transform:translateX(20px)}
.primary{width:100%;margin-top:20px;padding:16px;border-radius:99px;background:linear-gradient(135deg,var(--rose2),var(--rose));color:#fff;font:700 18px var(--fh);box-shadow:0 8px 20px rgba(239,109,138,.4)}
.primary[disabled]{opacity:.6}
.ghost{width:100%;margin-top:12px;padding:14px;border-radius:18px;border:1.5px dashed var(--rose);color:var(--rose);font-weight:800}
.danger{background:var(--rose);color:#fff;border-style:solid}
.preview{max-width:250px;margin:4px auto 0;transform:rotate(-2.5deg)}
.full{border-radius:22px;overflow:hidden;background:var(--card);padding:8px;box-shadow:0 8px 22px var(--shadow)}
.full img{width:100%;border-radius:16px;display:block;min-height:160px;background:var(--cell)}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px;padding:8px 4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:800;z-index:30;animation:fade .2s;max-width:90vw;text-align:center}
.hidden{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:16px;padding:5px;box-shadow:inset 0 0 0 1.5px var(--line);margin-bottom:14px}
.seg button{padding:10px;border-radius:12px;font-weight:800;min-height:44px}
.seg button[aria-pressed=true]{background:var(--rose);color:#fff}
.share-prev{display:grid;place-items:center;min-height:240px}
.share-prev img{max-width:100%;max-height:50vh;border-radius:18px;box-shadow:0 10px 26px var(--shadow);background:var(--cell)}
.hint{text-align:center;color:var(--soft);font-weight:700;font-size:13px;margin:10px 0 0}
.share-btn{display:block;margin:14px auto 0;padding:11px 22px;border-radius:99px;background:var(--pink);color:var(--rose);font-weight:800;min-height:44px}
.hdr-right{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.gear{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:0 4px 12px var(--shadow);display:grid;place-items:center;color:var(--rose);align-self:flex-end;margin-bottom:-26px;position:relative;z-index:1}
.install{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 14px;margin-bottom:14px;box-shadow:0 6px 18px var(--shadow);font-weight:700;font-size:15px}
.install b{font-family:var(--fh)}
.install .x{margin-left:auto;width:32px;height:32px;flex:none;border-radius:50%;background:var(--pink);color:var(--rose);font-weight:800}
.share-ico{display:inline-block;vertical-align:-3px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1.5px solid var(--line);font-weight:700}
.row span:last-child{color:var(--soft)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="hi" id="hi">Hello</div>
      <h1>Nibble</h1>
      <div class="date" id="today"></div>
    </div>
    <div class="hdr-right">
    <button class="gear" id="gear" aria-label="Settings and backup"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="46" fill="#fff"/><circle cx="50" cy="52" r="40" fill="none" stroke="#ffd0da" stroke-width="3"/><path d="M50 18c5 0 8 3 11 8l22 38c4 8-1 16-10 16H27c-9 0-14-8-10-16l22-38c3-5 6-8 11-8z" fill="#fffaf5" stroke="#7a4f59" stroke-width="2.5"/><rect x="39" y="58" width="22" height="22" rx="4" fill="#3a4a44"/><circle cx="41" cy="48" r="3.2" fill="#5b3a43"/><circle cx="59" cy="48" r="3.2" fill="#5b3a43"/><path d="M46 52q4 4 8 0" fill="none" stroke="#5b3a43" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="34" cy="54" rx="5" ry="3" fill="#ffadbc"/><ellipse cx="66" cy="54" rx="5" ry="3" fill="#ffadbc"/></svg>
    </div>
  </header>
  <div class="install hidden" id="install"><span style="font-size:26px">🍙</span><div><b>Install Nibble</b><br>Tap <svg class="share-ico" width="18" height="18" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M6 11H5v10h14V11h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Share, then <b>Add to Home Screen</b></div><button class="x" id="installX" aria-label="Dismiss">✕</button></div>

  <div class="stats">
    <div class="stat" style="background:var(--peach)"><b id="sStreak">0</b><span>day streak</span></div>
    <div class="stat" style="background:var(--mint)"><b id="sMonth">0</b><span>this month</span></div>
    <div class="stat" style="background:var(--lav)"><b id="sAll">0</b><span>all meals</span></div>
  </div>

  <section class="card" id="cal">
    <div class="cal-head">
      <button class="round" id="prev" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div><h2 id="monthName"></h2><small id="monthSub"></small></div>
      <button class="round" id="next" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="wk" id="wk"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="card" style="margin-top:16px">
    <div class="section-title"><h2>Today's plate</h2><span id="todayEmoji"></span></div>
    <div id="todayList"><div class="empty">Opening your diary…</div></div>
  </section>
  <p class="note" id="modeNote"></p>
</div>

<button class="snap" id="snap"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z" fill="#fff"/><circle cx="12" cy="12.3" r="3.6" fill="#ef6d8a"/></svg>Snap a meal</button>

<input type="file" id="cam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="lib" accept="image/*" class="hidden">
<input type="file" id="restore" accept="application/json,.json" class="hidden">

<script>
{
const TYPES=[{k:'breakfast',e:'🥞',c:'var(--butter)'},{k:'lunch',e:'🍱',c:'var(--mint)'},{k:'dinner',e:'🍝',c:'var(--peach)'},{k:'snack',e:'🍩',c:'var(--pink)'},{k:'drink',e:'🧋',c:'var(--lav)'}];
const T=k=>TYPES.find(t=>t.k===k)||TYPES[3];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const toLocalInput=ms=>{const d=new Date(ms);return dayKey(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const fromLocalInput=v=>{const m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(v||'');return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime():Date.now()};
const fmtTime=ms=>new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtDay=(ms,o)=>new Date(ms).toLocaleDateString([], o);
const suggest=ms=>{const h=new Date(ms).getHours();return h>=5&&h<11?'breakfast':h>=11&&h<15?'lunch':h>=18&&h<22?'dinner':'snack'};
const safeThumb=s=>typeof s==='string'&&s.startsWith('data:image/jpeg;base64,')?s:'';
const HEART='<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#fff"/></svg>';
const ONI='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 14c5 0 8 3 11 8l24 41c4 8-1 17-10 17H25c-9 0-14-9-10-17l24-41c3-5 6-8 11-8z" fill="#fffaf5" stroke="#7a4f59" stroke-width="2.5"/><rect x="38" y="57" width="24" height="23" rx="4" fill="#3a4a44"/><circle cx="40" cy="46" r="3.2" fill="#5b3a43"/><circle cx="60" cy="46" r="3.2" fill="#5b3a43"/><path d="M46 50q4 4 8 0" fill="none" stroke="#5b3a43" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="33" cy="52" rx="5" ry="3" fill="#ffadbc"/><ellipse cx="67" cy="52" rx="5" ry="3" fill="#ffadbc"/></svg>';

let meals=[],month=sod(new Date());month.setDate(1);
let store=null,ready=false,defaultAt=null;
const sheets=[];

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2400)}

/* ---------- storage: IndexedDB on this phone ---------- */
function localStore(){
  let idb=null,mem=[],cbs=[];const urls=new Map();
  const open=new Promise(r=>{try{const q=indexedDB.open('nibble',1);q.onupgradeneeded=()=>q.result.createObjectStore('meals',{keyPath:'id'});q.onsuccess=()=>{idb=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
  const tx=(mode,fn)=>new Promise((res,rej)=>{if(!idb)return res(null);const t=idb.transaction('meals',mode);const q=fn(t.objectStore('meals'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  const emit=()=>cbs.forEach(cb=>cb(mem.slice()));
  const put=async m=>{await tx('readwrite',st=>st.put(m));mem=mem.filter(x=>x.id!==m.id).concat(m);emit()};
  const newId=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
  return{
    ok:()=>!!idb,
    async listen(cb){cbs.push(cb);await open;if(idb)mem=(await tx('readonly',st=>st.getAll()))||[];emit()},
    photoUrl(m){if(!(m.photo instanceof Blob))return safeThumb(m.thumb);if(!urls.has(m.id))urls.set(m.id,URL.createObjectURL(m.photo));return urls.get(m.id)},
    async add(m,blob){if(!idb)throw new Error('nostore');await put({...m,id:newId(),photo:blob});if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})},
    async update(id,patch){const m=mem.find(x=>x.id===id);if(m)await put({...m,...patch})},
    async remove(m){await tx('readwrite',st=>st.delete(m.id));mem=mem.filter(x=>x.id!==m.id);if(urls.has(m.id)){URL.revokeObjectURL(urls.get(m.id));urls.delete(m.id)}emit()},
    async exportAll(){const out=[];for(const m of mem){out.push({...m,photo:m.photo instanceof Blob?await blobToDataUrl(m.photo):null})}return{app:'nibble',version:1,exported:new Date().toISOString(),meals:out}},
    async importAll(data){if(!data||data.app!=='nibble'||!Array.isArray(data.meals))throw new Error('format');let n=0;
      for(const r of data.meals){if(!r||typeof r.id!=='string'||typeof r.at!=='number')continue;
        const photo=typeof r.photo==='string'&&r.photo.startsWith('data:image/')?await (await fetch(r.photo)).blob():null;
        await put({id:r.id,type:T(r.type).k,at:r.at,note:String(r.note||'').slice(0,400),fav:!!r.fav,thumb:safeThumb(r.thumb),photo});n++}return n}};
}
const blobToDataUrl=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});

/* ---------- images ---------- */
async function loadImage(file){const url=URL.createObjectURL(file);const img=new Image();img.src=url;try{await img.decode()}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}return img}
function drawTo(img,max,square){const c=document.createElement('canvas'),x=c.getContext('2d');let w=img.naturalWidth,h=img.naturalHeight;
  if(square){const s=Math.min(w,h);c.width=c.height=max;x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,max,max)}
  else{const k=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*k);c.height=Math.round(h*k);x.drawImage(img,0,0,c.width,c.height)}return c}
const toBlob=(c,q)=>new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error('encode')),'image/jpeg',q));
async function exifDate(file){try{const v=new DataView(await file.slice(0,262144).arrayBuffer());if(v.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<v.byteLength-10){const m=v.getUint16(o),len=v.getUint16(o+2);if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiffDate(v,o+10);if((m&0xFF00)!==0xFF00)break;o+=2+len}}catch(e){}return null}
function tiffDate(v,t){const le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
  const ifd=p=>{const n=g16(p),o={};for(let i=0;i<n;i++){const e=p+2+i*12;o[g16(e)]={n:g32(e+4),at:e+8}}return o};
  const str=e=>{if(!e)return null;const off=e.n>4?t+g32(e.at):e.at;let s='';for(let i=0;i<e.n-1;i++)s+=String.fromCharCode(v.getUint8(off+i));return s};
  const i0=ifd(t+g32(t+4));let s=null;if(i0[0x8769]){const ex=ifd(t+g32(i0[0x8769].at));s=str(ex[0x9003])||str(ex[0x9004])}s=s||str(i0[0x0132]);
  const m=s&&/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(s);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime():null}

/* ---------- home ---------- */
function byDay(){const g={};for(const m of meals)(g[dayKey(m.at)]??=[]).push(m);for(const k in g)g[k].sort((a,b)=>a.at-b.at);return g}
function streak(g){let d=sod(new Date());if(!g[dayKey(d)])d.setDate(d.getDate()-1);let n=0;while(g[dayKey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function polaroid(m,i,sub){const t=T(m.type),tilt=[-3,2.5,2,-2.5,-1.5,3][i%6],th=safeThumb(m.thumb);
  return `<button class="pola" data-meal="${esc(m.id)}" style="transform:rotate(${tilt}deg)"><div class="ph">${th?`<img src="${th}" alt="">`:''}</div>${m.fav?`<span class="heart">${HEART}</span>`:''}<div class="cap">${t.e} ${cap(t.k)}</div><div class="sub">${esc(sub??fmtTime(m.at))}</div></button>`}
function render(){
  const now=new Date(),h=now.getHours(),g=byDay();
  $('hi').textContent=h>=5&&h<11?'Good morning ☀️':h>=11&&h<15?"Lunch o'clock 🍱":h>=15&&h<18?'Snack time? 🍪':h>=18&&h<22?'Good evening 🌙':'Late-night munchies ✨';
  $('today').textContent=fmtDay(now,{weekday:'long',day:'numeric',month:'long'});
  $('sStreak').textContent=streak(g);
  $('sMonth').textContent=meals.filter(m=>{const d=new Date(m.at);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;
  $('sAll').textContent=meals.length;
  // calendar
  const y=month.getFullYear(),mo=month.getMonth(),days=new Date(y,mo+1,0).getDate(),lead=(new Date(y,mo,1).getDay()+6)%7;
  $('monthName').textContent=fmtDay(month,{month:'long'});
  let logged=0,cells='';
  for(let i=0;i<lead;i++)cells+='<div class="day blank"></div>';
  for(let d=1;d<=days;d++){const dt=new Date(y,mo,d),k=dayKey(dt),list=g[k]||[],cover=list.find(m=>m.fav)||list[list.length-1],th=cover&&safeThumb(cover.thumb);
    if(list.length)logged++;
    const cls=['day',th?'has':'',k===dayKey(now)?'today':'',dt>now?'future':''].join(' ');
    cells+=`<button class="${cls}" data-day="${k}" aria-label="${esc(fmtDay(dt,{day:'numeric',month:'long'}))}, ${list.length} meals">${th?`<img src="${th}" alt="" loading="lazy">`:''}<span class="n">${d}</span>${list.length>1?`<span class="c">${list.length}</span>`:''}</button>`}
  $('grid').innerHTML=cells;
  $('monthSub').textContent=`${y} · ${logged} ${logged===1?'day':'days'} logged`;
  $('next').disabled=y===now.getFullYear()&&mo===now.getMonth();
  // today
  const tl=g[dayKey(now)]||[];
  $('todayEmoji').textContent=tl.map(m=>T(m.type).e).join('');
  $('todayList').innerHTML=!ready?'<div class="empty">Opening your diary…</div>':tl.length?`<div class="strip">${tl.map((m,i)=>polaroid(m,i)).join('')}</div>`:`<button class="empty" id="emptyToday" style="width:100%">${ONI}<h3>Nothing yet today!</h3>Tap to feed me your first meal photo 💕</button>`;
  $('modeNote').textContent=!ready?'':store.ok()?'Your meals live on this phone. Back them up from ⚙️ once in a while.':"This browser won't let Nibble save. Try Safari, outside private browsing.";
  sheets.forEach(s=>s.refresh&&s.refresh());
}

/* ---------- sheets ---------- */
function openSheet(build){const veil=document.createElement('div');veil.className='veil';const sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');veil.append(sh);
  const s={el:sh,close(){veil.remove();sheets.splice(sheets.indexOf(s),1)},refresh:null};
  veil.addEventListener('click',e=>{if(e.target===veil)s.close()});sheets.push(s);document.body.append(veil);build(s);return s}
const top=(title,extra='')=>`<div class="grab"></div><div class="sheet-top"><h2>${title}</h2><div style="display:flex;gap:8px">${extra}<button class="round" data-x aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14"><path d="m3 3 8 8m0-8-8 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div></div>`;
function wire(s){s.el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>s.close())}

function chooser(at){defaultAt=at;openSheet(s=>{
  s.el.innerHTML=top('Add a meal 🍽️')+`<label class="big-choice" for="cam"><i style="background:var(--pink)">📸</i>Take a photo</label><label class="big-choice" for="lib"><i style="background:var(--mint)">🖼️</i>Choose from library</label>`;
  wire(s);s.el.querySelectorAll('label').forEach(l=>l.addEventListener('click',()=>setTimeout(()=>s.close(),300)))})}

async function picked(file,fromLib){if(!file)return;
  try{const img=await loadImage(file);const exif=fromLib?await exifDate(file):null;
    const at=Math.min(exif||defaultAt||Date.now(),Date.now());
    const full=await toBlob(drawTo(img,1400,false),.82),thumb=drawTo(img,240,true).toDataURL('image/jpeg',.72);
    addSheet({full,thumb,at})}catch(e){toast("Couldn't read that photo 😢")}}

function editor(s,st,title,saveLabel,onSave,extra=''){
  const draw=()=>{const t=T(st.type);
    s.el.querySelector('.pv-cap')&&(s.el.querySelector('.pv-cap').textContent=`${t.e} ${cap(t.k)}`);
    s.el.querySelectorAll('.chip').forEach(c=>{const on=c.dataset.k===st.type;c.setAttribute('aria-pressed',on);c.style.background=on?T(c.dataset.k).c:''});
    s.el.querySelector('.fav').setAttribute('aria-pressed',st.fav)};
  s.el.innerHTML=top(title)+extra+`<div class="lbl">What meal is this?</div><div class="chips">${TYPES.map(t=>`<button class="chip" data-k="${t.k}"><em>${t.e}</em><span>${cap(t.k)}</span></button>`).join('')}</div>
    <div class="lbl">When did you eat it?</div><input class="field" type="datetime-local" id="f-at" value="${toLocalInput(st.at)}" max="${toLocalInput(Date.now())}">
    <div class="lbl">Notes</div><textarea class="field" id="f-note" maxlength="400" placeholder="What was it? Where? Yummy? 😋"></textarea>
    <button class="fav" aria-pressed="false"><span>❤️ Favourite meal</span><span class="sw"></span></button>
    <button class="primary" id="f-save">${saveLabel}</button>`;
  s.el.querySelector('#f-note').value=st.note||'';
  s.el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st.type=c.dataset.k;draw()});
  s.el.querySelector('.fav').onclick=()=>{st.fav=!st.fav;draw()};
  const btn=s.el.querySelector('#f-save');
  btn.onclick=async()=>{st.at=Math.min(fromLocalInput(s.el.querySelector('#f-at').value),Date.now());st.note=s.el.querySelector('#f-note').value.trim();
    btn.disabled=true;btn.textContent='Saving…';
    try{await onSave();}catch(e){btn.disabled=false;btn.textContent=saveLabel;toast(e&&e.name==='QuotaExceededError'?'Your phone storage is full 😢':'Could not save, try again')}};
  wire(s);draw()}

function addSheet({full,thumb,at}){const st={type:suggest(at),at,note:'',fav:false};const url=URL.createObjectURL(full);
  openSheet(s=>{editor(s,st,'New meal','Save to my food diary 💕',async()=>{
      await store.add({type:st.type,at:st.at,note:st.note,fav:st.fav,thumb},full);URL.revokeObjectURL(url);
      while(sheets.length)sheets[sheets.length-1].close();toast('Saved! 🍙');
      const d=new Date(st.at);month=new Date(d.getFullYear(),d.getMonth(),1);render()},
    `<div class="preview"><div class="pola" style="cursor:default"><div class="ph"><img src="${url}" alt="Your meal"></div><div class="cap pv-cap"></div></div></div>`)})}

function mealSheet(id){const m=meals.find(x=>x.id===id);if(!m)return;const st={type:m.type,at:m.at,note:m.note,fav:!!m.fav};
  openSheet(s=>{editor(s,st,esc(fmtDay(m.at,{day:'numeric',month:'short'}))+' · '+esc(fmtTime(m.at)),'Save changes',async()=>{
      await store.update(m.id,{type:st.type,at:st.at,note:st.note,fav:st.fav});s.close();toast('Updated ✨')},
    `<div class="full"><img alt="Meal photo" src="${esc(store.photoUrl(m))}"></div><button class="share-btn" id="m-share">💌 Share this meal</button>`);

function daySheet(k){const [y,mo,d]=k.split('-').map(Number),date=new Date(y,mo-1,d),isToday=k===dayKey(new Date());

/* ---------- share cards ---------- */
const CF='ui-rounded,"SF Pro Rounded",system-ui,sans-serif';
const CC={bg:'#fff6ee',dot:'#ffd9e1',ink:'#5b3a43',soft:'#9b7880',rose:'#ef6d8a'};
const P2={body:new Path2D('M50 14c5 0 8 3 11 8l24 41c4 8-1 17-10 17H25c-9 0-14-9-10-17l24-41c3-5 6-8 11-8z'),smile:new Path2D('M46 50q4 4 8 0'),heart:new Path2D('M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z')};
function rrect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fit(x,s,max){if(x.measureText(s).width<=max)return s;const a=Array.from(s);while(a.length>1&&x.measureText(a.join('')+'…').width>max)a.pop();return a.join('').trimEnd()+'…'}
function txt(x,s,px,py,{size=40,weight=700,color=CC.ink,align='center',max=0}={}){x.font=`${weight} ${Math.round(size)}px ${CF}`;x.fillStyle=color;x.textAlign=align;x.textBaseline='middle';x.fillText(max?fit(x,s,max):s,px,py)}
async function imgFrom(url){if(!url)return null;const i=new Image();i.src=url;await i.decode();return i}
function cover(x,img,a,b,s){const w=img.naturalWidth,h=img.naturalHeight,m=Math.min(w,h);x.drawImage(img,(w-m)/2,(h-m)/2,m,m,a,b,s,s)}
function cardBg(x,W,H){x.fillStyle=CC.bg;x.fillRect(0,0,W,H);x.fillStyle=CC.dot;const sp=56;for(let y=0,r=0;y<H+sp;y+=sp,r++)for(let a=r%2?sp/2:0;a<W+sp;a+=sp){x.beginPath();x.arc(a,y,5.5,0,7);x.fill()}}
function oni(x,a,b,s){x.save();x.translate(a,b);x.scale(s/100,s/100);x.fillStyle='#fffaf5';x.fill(P2.body);x.lineWidth=2.5;x.strokeStyle='#7a4f59';x.stroke(P2.body);
  x.fillStyle='#3a4a44';rrect(x,38,57,24,23,4);x.fill();x.fillStyle='#5b3a43';for(const e of[40,60]){x.beginPath();x.arc(e,46,3.2,0,7);x.fill()}
  x.strokeStyle='#5b3a43';x.lineWidth=2.2;x.lineCap='round';x.stroke(P2.smile);x.fillStyle='#ffadbc';for(const e of[33,67]){x.beginPath();x.ellipse(e,52,5,3,0,0,7);x.fill()}x.restore()}
function heartSticker(x,a,b,r){x.fillStyle=CC.rose;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=r*.18;x.stroke();const k=r/17;x.save();x.translate(a-12*k,b-12.6*k);x.scale(k,k);x.fillStyle='#fff';x.fill(P2.heart);x.restore()}
function pola(x,{img,cx,cy,size,rot=0,cap='',sub='',fav=false,tape=true}){
  const pad=size*.055,cs=Math.max(size*.068,30),ss=Math.max(size*.05,24),bot=sub?Math.max(size*.27,cs+ss+48):Math.max(size*.19,cs+40),w=size+pad*2,h=size+pad+bot,px=-w/2+pad,py=-h/2+pad;
  x.save();x.translate(cx,cy);x.rotate(rot*Math.PI/180);
  x.save();x.shadowColor='rgba(91,58,67,.22)';x.shadowBlur=size*.07;x.shadowOffsetY=size*.03;x.fillStyle='#fff';rrect(x,-w/2,-h/2,w,h,size*.025);x.fill();x.restore();
  x.save();rrect(x,px,py,size,size,size*.018);x.clip();x.fillStyle='#ffe9ee';x.fillRect(px,py,size,size);if(img)cover(x,img,px,py,size);x.restore();
  const block=sub?cs+12+ss:cs,capY=py+size+(bot-block)/2+cs/2;
  txt(x,cap,0,capY,{size:cs,max:size});
  if(sub)txt(x,sub,0,capY+cs/2+12+ss/2,{size:ss,weight:600,color:CC.soft,max:size});
  if(fav)heartSticker(x,px+size-size*.09,py+size*.09,size*.065);
  if(tape){x.save();x.translate(0,-h/2);x.rotate(-.07);x.fillStyle='rgba(255,165,186,.62)';x.fillRect(-size*.16,-size*.035,size*.32,size*.07);x.restore()}

function brand(x,W,y){const label='logged with Nibble';x.font=`700 34px ${CF}`;const pw=x.measureText(label).width+150,ph=84,l=(W-pw)/2;
  x.save();x.shadowColor='rgba(239,109,138,.2)';x.shadowBlur=24;x.shadowOffsetY=8;x.fillStyle='#fff';rrect(x,l,y-ph/2,pw,ph,ph/2);x.fill();x.restore();
  oni(x,l+20,y-33,68);txt(x,label,l+100,y,{size:34,align:'left',color:CC.rose})}
function canvasFor(fmt){const c=document.createElement('canvas');c.width=1080;c.height=fmt==='story'?1920:1350;const x=c.getContext('2d');cardBg(x,c.width,c.height);return[c,x]}
async function mealCard(m,fmt){const[c,x]=canvasFor(fmt),W=c.width,H=c.height,st=fmt==='story',t=T(m.type);
  const img=await imgFrom(store.photoUrl(m)).catch(()=>null),hy=st?330:115;
  txt(x,fmtDay(m.at,{weekday:'long',day:'numeric',month:'long'}),W/2,hy,{size:40,color:CC.soft});
  txt(x,`My ${t.k} ${t.e}`,W/2,hy+(st?95:80),{size:st?92:80,weight:800,max:W-120});
  const size=st?780:640,sub=(m.note||'').trim(),h=size*(1.055+(sub?.27:.19));
  pola(x,{img,cx:W/2,cy:hy+(st?205:160)+h/2,size,rot:-2.5,cap:`${t.e} ${cap(t.k)} · ${fmtTime(m.at)}`,sub,fav:m.fav});
  brand(x,W,st?H-260:H-78);return c}
async function dayCard(list,fmt){const[c,x]=canvasFor(fmt),W=c.width,H=c.height,st=fmt==='story',d=list[0].at,hy=st?330:105;
  txt(x,fmtDay(d,{weekday:'long',day:'numeric',month:'long'}),W/2,hy,{size:40,color:CC.soft});
  txt(x,dayKey(d)===dayKey(Date.now())?'What I ate today':'What I ate',W/2,hy+(st?95:76),{size:st?92:76,weight:800});
  txt(x,`${list.length} ${list.length===1?'meal':'meals'} · ${list.map(m=>T(m.type).e).join('')}`,W/2,hy+(st?180:146),{size:38,weight:700,color:CC.soft,max:W-160});
  const shown=list.slice(0,6),n=shown.length,[cols,rows]=n===1?[1,1]:n===2?(st?[1,2]:[2,1]):n<=4?[2,2]:(st?[2,3]:[3,2]);
  const top=hy+(st?240:195),bot=st?H-340:H-150,cw=(W-80)/cols,ch=(bot-top)/rows,size=Math.min(cw*.8,ch*.9/1.36);
  const imgs=await Promise.all(shown.map(m=>imgFrom(store.photoUrl(m)).catch(()=>null))),tilts=[-3,2.5,2,-2.5,-1.5,3];
  shown.forEach((m,i)=>{const row=Math.floor(i/cols),inRow=Math.min(cols,n-row*cols),off=(cols-inRow)*cw/2,t=T(m.type);
    pola(x,{img:imgs[i],cx:40+off+cw*(i%cols+.5),cy:top+ch*(row+.5),size,rot:tilts[i%6],cap:`${t.e} ${cap(t.k)}`,sub:fmtTime(m.at),fav:m.fav,tape:i%2===0})});
  if(list.length>6){const a=W-150,b=bot-30;x.fillStyle=CC.rose;x.beginPath();x.arc(a,b,70,0,7);x.fill();txt(x,`+${list.length-6}`,a,b,{size:48,weight:800,color:'#fff'})}
  brand(x,W,st?H-260:H-72);return c}
function shareSheet(kind,data){let fmt='post',file=null,url=null,job=0;
  openSheet(s=>{const close=s.close;s.close=()=>{if(url)URL.revokeObjectURL(url);close()};
    s.el.innerHTML=top(kind==='meal'?'Share this meal 💌':'Share this day 💌')+`<div class="seg"><button data-f="post" aria-pressed="true">Post · Chat</button><button data-f="story" aria-pressed="false">Story</button></div><div class="share-prev"><img id="sp-img" alt="Share picture preview"></div><button class="primary" id="sp-go" disabled>Making it cute…</button><p class="hint">Pick Telegram, WhatsApp or Instagram from the share menu</p>`;
    wire(s);const go=s.el.querySelector('#sp-go'),im=s.el.querySelector('#sp-img');
    const build=async()=>{const my=++job;file=null;go.disabled=true;go.textContent='Making it cute…';
      try{const c=kind==='meal'?await mealCard(data,fmt):await dayCard(data,fmt);const blob=await toBlob(c,.92);if(my!==job)return;
        file=new File([blob],`nibble-${dayKey(kind==='meal'?data.at:data[0].at)}.jpg`,{type:'image/jpeg'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);im.src=url;go.disabled=false;go.textContent='💌 Share'}
      catch(e){if(my===job){go.textContent='Could not make the picture';toast('Could not make the picture 😢')}}};
    s.el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(fmt===b.dataset.f)return;fmt=b.dataset.f;s.el.querySelectorAll('[data-f]').forEach(o=>o.setAttribute('aria-pressed',o===b));build()});
    go.onclick=()=>{if(file)shareFileNow(file)};
    build()})}

/* ---------- settings & backup ---------- */
function downloadFile(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
// Call straight from a tap: iPhone only opens the share menu if nothing slow happens first.
function shareFileNow(file){if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file]}).catch(e=>{if(!e||e.name!=='AbortError')downloadFile(file)});else downloadFile(file)}
function settingsSheet(){openSheet(s=>{
  const days=Object.keys(byDay()).length,favs=meals.filter(m=>m.fav).length;
  s.el.innerHTML=top('Settings ⚙️')+`<div class="row"><span>Meals logged</span><span>${meals.length}</span></div><div class="row"><span>Days with photos</span><span>${days}</span></div><div class="row"><span>Favourites</span><span>${favs}</span></div><div class="row"><span>Space used</span><span id="used">…</span></div>
    <div class="lbl">Backup</div><p style="margin:0 2px;color:var(--soft);font-weight:700;font-size:14px">Your meals are saved only on this phone. Save a backup to Files or iCloud Drive now and then, so you can restore it on a new phone.</p>
    <button class="primary" id="bk">💾 Save a backup</button><label class="ghost" for="restore" style="display:block;text-align:center;cursor:pointer">📂 Restore from a backup</label>`;
  wire(s);
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const el=s.el.querySelector('#used');if(el)el.textContent=(e.usage/1048576).toFixed(1)+' MB'}).catch(()=>{});
  const bk=s.el.querySelector('#bk');
  let ready=null;
  bk.onclick=async()=>{if(ready){shareFileNow(ready);return}
    bk.disabled=true;bk.textContent='Packing your meals…';
    try{const data=await store.exportAll();ready=new File([JSON.stringify(data)],`nibble-backup-${dayKey(new Date())}.json`,{type:'application/json'});bk.textContent='📤 Save backup file';toast('Backup ready! Tap again to save it')}
    catch(e){bk.textContent='💾 Save a backup';toast('Backup failed 😢')}bk.disabled=false}})}
$('restore').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const n=await store.importAll(JSON.parse(await f.text()));while(sheets.length)sheets[sheets.length-1].close();toast(`Restored ${n} meals 🎉`)}catch(err){toast("That doesn't look like a Nibble backup")}};
$('gear').onclick=()=>settingsSheet();

/* ---------- install hint (iPhone Safari, not yet installed) ---------- */
{const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 let dismissed=false;try{dismissed=localStorage.getItem('nibble-install-x')==='1'}catch(e){}
 if(ios&&!standalone&&!dismissed)$('install').classList.remove('hidden');
 $('installX').onclick=()=>{$('install').classList.add('hidden');try{localStorage.setItem('nibble-install-x','1')}catch(e){}}}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{const p=e.target.closest('[data-meal]');if(p){mealSheet(p.dataset.meal);return}
  const d=e.target.closest('[data-day]');if(d){daySheet(d.dataset.day);return}
  if(e.target.closest('#emptyToday'))chooser(Date.now())});
$('snap').onclick=()=>chooser(Date.now());
$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};
$('next').onclick=()=>{const n=new Date(month.getFullYear(),month.getMonth()+1,1);if(n<=new Date()){month=n;render()}};
let sx=null;$('cal').addEventListener('touchstart',e=>{sx=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
$('cal').addEventListener('touchend',e=>{if(!sx)return;const dx=e.changedTouches[0].clientX-sx[0],dy=e.changedTouches[0].clientY-sx[1];sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)$(dx<0?'next':'prev').click()});
$('cam').onchange=e=>{picked(e.target.files[0],false);e.target.value=''};
$('lib').onchange=e=>{picked(e.target.files[0],true);e.target.value=''};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheets.length)sheets[sheets.length-1].close()});
$('wk').innerHTML=['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('');

render();
store=localStore();
store.listen(list=>{meals=list.filter(m=>m&&typeof m.at==='number');ready=true;render()});
}
</script>
</body>
</html>
